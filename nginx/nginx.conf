worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain application/json application/xml text/css application/javascript;

  # ---------------------------------------------------------------
  # tu-dominio.com -> frontend Next.js (SSR)
  # ---------------------------------------------------------------
  server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com;

    location / {
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---------------------------------------------------------------
  # api.tu-dominio.com -> backend Express (API + feed XML)
  # ---------------------------------------------------------------
  server {
    listen 80;
    server_name api.tu-dominio.com;

    location / {
      proxy_pass http://backend:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---------------------------------------------------------------
  # n8n.tu-dominio.com -> instancia de n8n (webhooks de mensajería)
  # ---------------------------------------------------------------
  server {
    listen 80;
    server_name n8n.tu-dominio.com;

    location / {
      proxy_pass http://n8n:5678;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # n8n usa WebSockets para el editor en vivo
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
